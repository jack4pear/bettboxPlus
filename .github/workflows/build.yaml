name: Package BettboxPlus
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yaml
  signing:
    runs-on: ubuntu-24.04
    steps:
      - name: Require persistent fork signing key
        env:
          BETTBOXPLUS_KEYSTORE_BASE64: ${{ secrets.BETTBOXPLUS_KEYSTORE_BASE64 }}
          BETTBOXPLUS_STORE_PASSWORD: ${{ secrets.BETTBOXPLUS_STORE_PASSWORD }}
          BETTBOXPLUS_KEY_ALIAS: ${{ secrets.BETTBOXPLUS_KEY_ALIAS }}
          BETTBOXPLUS_KEY_PASSWORD: ${{ secrets.BETTBOXPLUS_KEY_PASSWORD }}
        shell: bash
        run: |
          for key in BETTBOXPLUS_KEYSTORE_BASE64 BETTBOXPLUS_STORE_PASSWORD BETTBOXPLUS_KEY_ALIAS BETTBOXPLUS_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Release blocked: missing $key"; exit 1; fi
          done
  build:
    needs: [check, signing]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-2022, arch: amd64, compatible: true }
          - { platform: windows, os: windows-11-arm, arch: arm64 }
          - { platform: android, os: ubuntu-24.04, arch: arm64, target: android-arm64, suffix: arm64-v8a }
          - { platform: android, os: ubuntu-24.04, arch: arm, target: android-arm, suffix: armeabi-v7a }
          - { platform: android, os: ubuntu-24.04, arch: amd64, target: android-x64, suffix: x86_64 }
          - { platform: android, os: ubuntu-24.04, arch: universal, target: 'android-arm,android-arm64,android-x64', suffix: universal }
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/verify-source.py
      - run: python scripts/setup-toolchain.py
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.platform == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || (matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc') }}
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: matrix.platform != 'windows' || matrix.arch != 'arm64'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Bootstrap pinned Flutter on Windows ARM64
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $flutterRoot = Join-Path $env:GITHUB_WORKSPACE '.toolchain/flutter-arm64'
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git $flutterRoot
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout failed' }
          $lock = Get-Content build-lock.json | ConvertFrom-Json
          $actual = git -C $flutterRoot rev-parse HEAD
          if ($actual -ne $lock.toolchain.flutter_commit) { throw 'Flutter source commit mismatch' }
          $env:PROCESSOR_ARCHITECTURE = 'ARM64'
          & "$flutterRoot/bin/flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Flutter bootstrap failed' }
          & "$flutterRoot/bin/cache/dart-sdk/bin/dart.exe" --version
          "$flutterRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Android NDK
        if: matrix.platform == 'android'
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Android signing
        if: matrix.platform == 'android'
        env:
          BETTBOXPLUS_KEYSTORE_BASE64: ${{ secrets.BETTBOXPLUS_KEYSTORE_BASE64 }}
          BETTBOXPLUS_STORE_PASSWORD: ${{ secrets.BETTBOXPLUS_STORE_PASSWORD }}
          BETTBOXPLUS_KEY_ALIAS: ${{ secrets.BETTBOXPLUS_KEY_ALIAS }}
          BETTBOXPLUS_KEY_PASSWORD: ${{ secrets.BETTBOXPLUS_KEY_PASSWORD }}
        run: python scripts/android-signing.py
      - name: Compile bridge and helper from source
        run: dart setup.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} --out core ${{ matrix.compatible == true && '--compatible' || '' }}
      - name: Windows app and installer (unsigned)
        if: matrix.platform == 'windows'
        run: |
          hash=$(sha256sum libclash/windows/BettboxPlusCore.exe | cut -d' ' -f1)
          desc='${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}'
          libclash/windows/BettboxPlusCore.exe --version | tee kernel-version.txt
          grep -q 3803eebbdb4ac3e92d39b1104e1c5ae668c2b18f kernel-version.txt
          flutter build windows --release --dart-define=CORE_SHA256="$hash" --dart-define=APP_ENV=pre --dart-define=APP_ASSET_SUFFIX=windows-$desc-setup.exe
          dart windows/packaging/exe/package_windows.dart --arch ${{ matrix.arch }} ${{ matrix.compatible == true && '--compatible' || '' }} --env pre
      - name: Android APK
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release --target-platform=${{ matrix.target }} --dart-define=APP_ENV=pre --dart-define=APP_ASSET_SUFFIX=android-${{ matrix.suffix }}.apk
          mkdir -p dist
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-release.apk "dist/BettboxPlus-$version-android-${{ matrix.suffix }}.apk"
      - name: Build provenance and checksums
        run: python scripts/build-info.py ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: BettboxPlus-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
